def baniraCoordinateVersion = "${loader_type}-${minecraft_version}-${banira_version}"
def baniraMavenJar = new File(
        System.getProperty("user.home"),
        ".m2/repository/xin/vanilla/banira/banira_codex/${baniraCoordinateVersion}/banira_codex-${baniraCoordinateVersion}.jar"
)
def baniraRemapRoot = file("${rootDir}/.gradle/loom-cache/remapped_mods/remapped/xin/vanilla/banira")

if (baniraMavenJar.isFile() && baniraRemapRoot.isDirectory()) {
    def staleRoots = [] as Set
    fileTree(baniraRemapRoot) {
        include "**/${baniraCoordinateVersion}/banira_codex-*.jar"
        exclude "**/*-sources.jar"
    }.files.each { remappedJar ->
        if (remappedJar.lastModified() < baniraMavenJar.lastModified()) {
            // Loom 按坐标缓存 remap 结果；同版本本地发布后只清理对应 Banira 目录。
            staleRoots.add(remappedJar.parentFile.parentFile)
        }
    }
    staleRoots.each { staleRoot ->
        logger.lifecycle("Refreshing stale Banira Loom cache: ${staleRoot.name}")
        delete staleRoot
    }
}
