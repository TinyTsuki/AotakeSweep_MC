import java.time.LocalDateTime
import java.time.format.DateTimeFormatter
import java.util.concurrent.TimeUnit
import groovy.json.JsonOutput
import java.security.MessageDigest

def smokeRoot = file(project.findProperty('aotake.networkSmoke.root') ?: "${projectDir}/run-network-smoke")
def smokeServerDir = file("${smokeRoot}/server")
def smokeClientDir = file("${smokeRoot}/client")
def smokePort = 25575
def smokeChild = (project.findProperty('aotake.networkSmoke.child') ?: 'false').toString().toBoolean()
def mutableThresholds = (project.findProperty('aotake.networkSmoke.mutableThresholds') ?: 'false').toString().toBoolean()
def worldSeed = project.findProperty('aotake.networkSmoke.worldSeed')?.toString()
if (worldSeed != null) Long.parseLong(worldSeed)

// 服务端和客户端使用独立输出目录，避免两个 Gradle 运行任务争用构建文件。
if (smokeChild) {
    layout.buildDirectory.set(file(project.property('aotake.networkSmoke.buildDir')))
    String phase = project.property('aotake.networkSmoke.phase').toString()
    String status = project.property('aotake.networkSmoke.status').toString()
    String sparkReport = project.property('aotake.networkSmoke.sparkReport').toString()
    String serverStatus = (project.findProperty('aotake.networkSmoke.serverStatus') ?: '').toString()
    runs {
        configureEach {
            systemProperty 'aotake.networkSmoke', 'true'
            systemProperty 'aotake.networkSmoke.phase', phase
            systemProperty 'aotake.networkSmoke.status', status
            systemProperty 'aotake.networkSmoke.sparkReport', sparkReport
            systemProperty 'aotake.networkSmoke.serverStatus', serverStatus
            systemProperty 'aotake.networkSmoke.mutableThresholds', mutableThresholds.toString()
            ['clientSparkReport', 'checkpoint'].each { name ->
                systemProperty "aotake.networkSmoke.${name}", project.property("aotake.networkSmoke.${name}").toString()
            }
        }
        server {
            workingDirectory smokeServerDir
            arguments.addAll(['--nogui', '--port', smokePort.toString()])
        }
        client {
            workingDirectory smokeClientDir
            systemProperty 'aotake.networkSmoke.host', '127.0.0.1'
            systemProperty 'aotake.networkSmoke.port', smokePort.toString()
            arguments.addAll(['--username', 'NetworkSmoke', '--uuid', '380df991-f603-344c-a090-369bad2a924a'])
        }
    }
}

def readUtf8 = { File file -> file.isFile() ? file.getText('UTF-8') : '' }

def tailUtf8 = { File file, int lines ->
    if (!file.isFile()) return ''
    List<String> all = file.readLines('UTF-8')
    return all.drop(Math.max(0, all.size() - lines)).join(System.lineSeparator())
}

def destroyProcessTree = { Process process ->
    if (process == null || !process.isAlive()) return
    process.toHandle().descendants().forEach { handle -> handle.destroyForcibly() }
    process.destroyForcibly()
    process.waitFor(15, TimeUnit.SECONDS)
}

def waitForStatus = { Process process, File status, String marker, File log, int timeoutSeconds ->
    long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(timeoutSeconds)
    while (System.nanoTime() < deadline) {
        String content = readUtf8(status)
        if (content.contains('FAIL ')) {
            throw new GradleException("Network smoke failed while waiting for '${marker}':\n${content}\n${tailUtf8(log, 80)}")
        }
        if (content.contains(marker)) return
        if (!process.isAlive()) {
            throw new GradleException("Process exited before '${marker}' (exit ${process.exitValue()}):\n${tailUtf8(log, 120)}")
        }
        Thread.sleep(500L)
    }
    throw new GradleException("Timed out waiting for '${marker}':\n${tailUtf8(log, 120)}")
}

def stageChildProject = { String runTask ->
    File childRoot = new File(smokeRoot, runTask == 'runServer' ? 'server-gradle' : 'client-gradle')
    File childProject = new File(childRoot, 'project')
    project.sync { spec ->
        spec.from projectDir
        spec.into childProject
        spec.include 'build.gradle', 'settings.gradle', 'gradle.properties', 'jdks.properties', 'gradlew', 'gradlew.bat'
        spec.include 'gradle/**', 'src/**'
    }
    childProject
}

def gradleCommand = { File childProject, String runTask, String phase, File status, File report, File childBuildDir, File projectCacheDir, File serverStatus ->
    File wrapper = new File(childProject, System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew')
    List<String> command = []
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        command.addAll(['cmd.exe', '/d', '/c', wrapper.absolutePath])
    } else {
        command.add(wrapper.absolutePath)
    }
    command.addAll([
            runTask,
            '--no-daemon',
            '--console=plain',
            '--project-cache-dir', projectCacheDir.absolutePath,
            '-Paotake.networkSmoke.child=true',
            "-Paotake.networkSmoke.root=${smokeRoot.absolutePath}".toString(),
            "-Paotake.networkSmoke.mutableThresholds=${mutableThresholds}".toString(),
            "-Paotake.networkSmoke.phase=${phase}".toString(),
            "-Paotake.networkSmoke.status=${status.absolutePath}".toString(),
            "-Paotake.networkSmoke.sparkReport=${report.absolutePath}".toString(),
            "-Paotake.networkSmoke.clientSparkReport=${new File(status.parentFile, "spark-client-report-${phase}.sparkprofile").absolutePath}".toString(),
            "-Paotake.networkSmoke.checkpoint=${new File(status.parentFile, 'final-checkpoint.properties').absolutePath}".toString(),
            "-Paotake.networkSmoke.buildDir=${childBuildDir.absolutePath}".toString()
    ])
    if (serverStatus != null) {
        command.add("-Paotake.networkSmoke.serverStatus=${serverStatus.absolutePath}".toString())
    }
    if (runTask == 'runServer') {
        command.add('-Paotake.networkSmoke.server=true')
    }
    return command
}

def startGradleRun = { String runTask, String phase, File status, File report, File log, File serverStatus, boolean prepareOnly = false ->
    File childRoot = new File(smokeRoot, runTask == 'runServer' ? 'server-gradle' : 'client-gradle')
    File childBuildDir = new File(childRoot, 'build')
    File projectCacheDir = new File(childRoot, 'project-cache')
    childBuildDir.mkdirs()
    projectCacheDir.mkdirs()
    log.parentFile.mkdirs()
    File childProject = stageChildProject(runTask)
    List<String> command = gradleCommand(childProject, runTask, phase, status, report, childBuildDir, projectCacheDir, serverStatus)
    if (prepareOnly) command.set(command.indexOf(runTask), 'classes')
    ProcessBuilder builder = new ProcessBuilder(command)
    builder.directory(childProject)
    builder.redirectErrorStream(true)
    builder.redirectOutput(log)
    return builder.start()
}

def stopServer = { Process server, File log ->
    if (server == null) return
    if (server.isAlive() && !server.waitFor(60, TimeUnit.SECONDS)) {
        destroyProcessTree(server)
        throw new GradleException("Dedicated server did not stop cleanly:\n${tailUtf8(log, 120)}")
    }
    if (server.exitValue() != 0) {
        throw new GradleException("Dedicated server exited with ${server.exitValue()}:\n${tailUtf8(log, 120)}")
    }
}

def verifyMarkers = { File status, List<String> markers ->
    String content = readUtf8(status)
    markers.each { marker ->
        if (!content.contains(marker)) {
            throw new GradleException("Missing '${marker}' in ${status}:\n${content}")
        }
    }
}

def runNetworkSmokeServer = { String phase, File status, File report, File log ->
    startGradleRun('runServer', phase, status, report, log, null)
}

def runNetworkSmokeClient = { String phase, File status, File report, File log, File serverStatus ->
    startGradleRun('runClient', phase, status, report, log, serverStatus)
}

tasks.register('networkSmoke') {
    group = 'verification'
    description = 'Runs a bounded two-phase dedicated server/client persistence smoke.'

    doLast {
        if (smokeChild) {
            throw new GradleException('networkSmoke cannot run inside its child Gradle process')
        }
        [smokeServerDir, smokeClientDir].each { directory ->
            if (directory.canonicalFile.parentFile != smokeRoot.canonicalFile
                    || !['server', 'client'].contains(directory.name)) {
                throw new GradleException("Refusing to clean non-isolated directory: ${directory}")
            }
            delete directory
        }
        smokeServerDir.mkdirs()
        smokeClientDir.mkdirs()
        File sparkConfig = new File(smokeServerDir, 'config/spark/config.json')
        sparkConfig.parentFile.mkdirs()
        sparkConfig.setText('{"backgroundProfiler":false}' + System.lineSeparator(), 'UTF-8')
        new File(smokeServerDir, 'eula.txt').setText('eula=true' + System.lineSeparator(), 'UTF-8')
        new File(smokeServerDir, 'server.properties').setText(
                "online-mode=false${System.lineSeparator()}server-port=${smokePort}${System.lineSeparator()}" +
                        "level-name=network-smoke-world${System.lineSeparator()}view-distance=4${System.lineSeparator()}" +
                        (worldSeed == null ? '' : "level-seed=${worldSeed}${System.lineSeparator()}"),
                'UTF-8')

        String runId = DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss').format(LocalDateTime.now())
        File evidence = file("${smokeRoot}/evidence/${runId}")
        evidence.mkdirs()
        def sha256 = { File input -> MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
        def sources = fileTree(projectDir) {
            include 'src/**', 'scripts/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties'
        }.files.sort { left, right -> left.path <=> right.path }
        def runtimeJars = configurations.runtimeClasspath.files.findAll { it.isFile() &&
                (it.name.contains('banira_codex') || it.name.toLowerCase().startsWith('spark-')) }
        def profiler = runtimeJars.find { it.name.toLowerCase().startsWith('spark-') }
        if (profiler == null) throw new GradleException('Spark runtime not found')
        new File(evidence, 'spark-runtime-phase-one.txt').setText(profiler.absolutePath + System.lineSeparator(), 'UTF-8')
        new File(evidence, 'source-state.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                commit: providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim(),
                status: providers.exec { commandLine 'git', 'status', '--porcelain', '--untracked-files=all' }.standardOutput.asText.get(),
                files: sources.collectEntries { source ->
                    [(projectDir.toPath().relativize(source.toPath()).toString().replace('\\', '/')): sha256(source)]
                },
                runtimeJars: runtimeJars.collectEntries { [(it.absolutePath): sha256(it)] },
                serverSampleSeconds: 60, clientSampleSeconds: 20, cycles: 20, worldSeed: worldSeed,
                mutableThresholds: mutableThresholds,
                paperPerCycle: mutableThresholds ? 2000 : 2528, globalEntitiesPerCycle: 160
        ])) + System.lineSeparator(), 'UTF-8')

        // Native game compilation belongs to preparation, outside the bounded game startup window.
        ['runServer', 'runClient'].each { task ->
            File log = new File(evidence, "prepare-${task}.log")
            Process preparation = startGradleRun(task, 'phase-one',
                    new File(evidence, "prepare-${task}.status"),
                    new File(evidence, 'spark-report-phase-one.sparkprofile'), log, null, true)
            try {
                if (!preparation.waitFor(600, TimeUnit.SECONDS)) {
                    throw new GradleException("Smoke build preparation timed out: ${task}\n${tailUtf8(log, 80)}")
                }
                if (preparation.exitValue() != 0) {
                    throw new GradleException("Smoke build preparation failed: ${task}\n${tailUtf8(log, 80)}")
                }
            } finally {
                destroyProcessTree(preparation)
            }
        }

        ['phase-one', 'phase-two'].each { phase ->
            File serverStatus = new File(evidence, "server-${phase}.status")
            File clientStatus = new File(evidence, "client-${phase}.status")
            File report = new File(evidence, "spark-report-${phase}.sparkprofile")
            File serverLog = new File(evidence, "server-${phase}.log")
            File clientLog = new File(evidence, "client-${phase}.log")
            Process server = null
            Process client = null
            try {
                server = runNetworkSmokeServer(phase, serverStatus, report, serverLog)
                waitForStatus(server, serverStatus, 'PASS server-ready', serverLog, 180)

                client = runNetworkSmokeClient(phase, clientStatus, report, clientLog, serverStatus)
                if (phase == 'phase-one') {
                    waitForStatus(client, clientStatus, 'PASS config-roundtrip', clientLog, 180)
                    waitForStatus(server, serverStatus, 'PASS spark-profiler-active', serverLog, 120)
                    waitForStatus(server, serverStatus, 'PASS spark-report-written', serverLog, 80)
                    if (!report.isFile() || report.length() == 0L) {
                        throw new GradleException("Spark report was not written: ${report}")
                    }
                    waitForStatus(client, clientStatus, 'PASS client-ui-spark-report-written', clientLog, 120)
                    File clientReport = new File(evidence, "spark-client-report-${phase}.sparkprofile")
                    if (!clientReport.isFile() || clientReport.length() == 0L) {
                        throw new GradleException("Client Spark report missing: ${clientReport}")
                    }
                } else {
                    waitForStatus(client, clientStatus, 'PASS persisted-world-data-client', clientLog, 180)
                }
                waitForStatus(server, serverStatus, "FINISHED ${phase}", serverLog, 90)
                stopServer(server, serverLog)
                waitForStatus(client, clientStatus, "FINISHED ${phase}", clientLog, 45)
                if (!client.waitFor(45, TimeUnit.SECONDS)) {
                    throw new GradleException("Client did not exit after ${phase}:\n${tailUtf8(clientLog, 120)}")
                }
                if (client.exitValue() != 0) {
                    throw new GradleException("Client exited with ${client.exitValue()}:\n${tailUtf8(clientLog, 120)}")
                }

                verifyMarkers(clientStatus, ['PASS notification-routes-client types=11',
                        'PASS notification-production-received help vault-list'])
                verifyMarkers(serverStatus, ['PASS notification-routes-submitted types=11',
                        'PASS notification-production-commands help vault-list'])
                String configMarker = phase == 'phase-one' ? 'PASS complete-config-snapshot' : 'PASS complete-config-restart'
                [clientStatus, serverStatus].each { status -> verifyMarkers(status, [configMarker]) }
                verifyMarkers(clientStatus, phase == 'phase-one'
                        ? ['PASS remote-login-sync', 'PASS config-roundtrip',
                           'PASS client-ui-spark-report-written', 'PASS client-ui-sustained-workload', 'FINISHED phase-one']
                        : ['PASS remote-login-sync', 'PASS persisted-player-data-client',
                           'PASS persisted-world-data-client', 'FINISHED phase-two'])
                verifyMarkers(serverStatus, phase == 'phase-one'
                        ? ['PASS config-command-roundtrip', 'PASS server-config-roundtrip',
                           'PASS countdown-cleanup', 'PASS chunk-cleanup', 'PASS burst-drop-cleanup',
                           'PASS global-batch-cleanup', 'PASS entity-capture',
                           'PASS measured-chunks-ready chunks=4', 'PASS measured-cleanup', 'PASS operation container-break', 'PASS operation container-recovery',
                           'PASS operation global-countdown-recovery', 'PASS operation chunk-recovery',
                           'PASS operation capture-submit', 'PASS operation capture-complete',
                           'PASS operation pipeline-submit', 'PASS operation pipeline-complete', 'PASS final-checkpoint',
                           'PASS spark-profiler-active', 'PASS sustained-cleanup-workload', 'PASS spark-report-written', 'PASS phase-one-world-write', 'FINISHED phase-one',
                           'PASS server-shutdown']
                        : ['PASS persisted-command-config', 'PASS persisted-player-data', 'PASS persisted-final-cycle',
                           'PASS persisted-world-data', 'FINISHED phase-two',
                           'PASS server-shutdown'])
            } finally {
                destroyProcessTree(client)
                destroyProcessTree(server)
                [server: smokeServerDir, client: smokeClientDir].each { side, directory ->
                    copy {
                        from new File(directory, 'crash-reports')
                        into new File(evidence, "${side}-${phase}-crash-reports")
                        include 'crash-*.txt'
                    }
                    copy {
                        from new File(directory, 'config')
                        into new File(evidence, "${side}-${phase}-config")
                        include 'aotake_sweep*'
                    }
                }
            }
        }

        List<File> crashReports = [smokeServerDir, smokeClientDir].collectMany { directory ->
            fileTree(directory) { include '**/crash-reports/crash-*.txt' }.files as List<File>
        }
        if (!crashReports.isEmpty()) {
            throw new GradleException("Network smoke created crash reports: ${crashReports*.absolutePath}")
        }
        logger.lifecycle("Aotake network smoke FINISHED: ${evidence}")
    }
}
