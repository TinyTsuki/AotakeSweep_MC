plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
}

def javaVer = 21

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// region banira_codex：JarJar
def baniraArtifactVersionRange = "${banira_version_range}"
// endregion banira_codex

repositories {
    flatDir {
        dir 'libs'
    }
    maven { name "CurseMaven"; url "https://cursemaven.com" }
    mavenLocal()
    // IE
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    // JEI
    maven { name = "DVS1 Maven FS"; url = "https://dvs1.progwml6.com/files/maven" }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"
    jarJar("xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}") {
        jarJar.ranged(it, baniraArtifactVersionRange)
    }

    // JEI
    runtimeOnly "curse.maven:jei-238222:${jei_id}"
    // AE
    // runtimeOnly fg.deobf("blank:appliedenergistics2:8.4.7")
    // IE
    // runtimeOnly fg.deobf("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}")

    // Narcissus
    compileOnly "curse.maven:narcissus-farewell-1210871:${narcissus_maven_id}"

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
                             loader_type         : loader_type,
                             banira_version_range: banira_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

// region 将含 Jar-in-Jar 的 reobf 合并包同步到 builds
def aotakeCopyFatJar = { File fat, String destName ->
    if (fat != null && fat.exists()) {
        copy {
            from fat
            into file("${projectDir}/builds/${mod_version}")
            rename { destName }
        }
    }
}

afterEvaluate {
    def reobfJarJarTask = tasks.findByName('reobfJarJar')
    if (reobfJarJarTask != null) {
        reobfJarJarTask.doLast {
            def reobfFat = layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
            aotakeCopyFatJar(reobfFat, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
        }
        tasks.named('assemble').configure { dependsOn reobfJarJarTask }
    } else {
        def jarJarTask = tasks.findByName('jarJar')
        if (jarJarTask != null) {
            jarJarTask.doLast {
                def jar = jarJarTask.archiveFile.get().asFile
                aotakeCopyFatJar(jar, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
            }
            tasks.named('assemble').configure { dependsOn jarJarTask }
        }
    }
}
// endregion

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
