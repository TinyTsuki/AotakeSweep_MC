buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

def javaVer = 21

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

minecraft {
    mappings channel: mapping_channel, version: minecraft_version

    reobf = false

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            def uiSmoke = (project.findProperty('aotake.uiSmoke') ?: System.getProperty('aotake.uiSmoke') ?: 'false').toString()
            def uiSmokeExit = (project.findProperty('aotake.uiSmoke.exitOnFinish') ?: System.getProperty('aotake.uiSmoke.exitOnFinish') ?: 'false').toString()
            def uiSmokeWorld = (project.findProperty('aotake.uiSmoke.world') ?: System.getProperty('aotake.uiSmoke.world') ?: '').toString()
            property 'aotake.uiSmoke', uiSmoke
            property 'aotake.uiSmoke.exitOnFinish', uiSmokeExit
            property 'aotake.uiSmoke.world', uiSmokeWorld
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

def mixinConfigName = "${mod_id}.mixins.json"
def generatedMixinRefmap = layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json")

// runClient 会注入 Mixin 参数；正式 jar 必须自行声明配置并携带 refmap。
def addMixinRuntimeMetadata = { archiveTask ->
    archiveTask.dependsOn tasks.named('compileJava')
    archiveTask.from(generatedMixinRefmap)
    archiveTask.manifest.attributes('MixinConfigs': mixinConfigName)
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// region banira_codex：JarJar
def baniraArtifactVersionRange = "${banira_version_range}"
def baniraCodexCoords = "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"
// endregion banira_codex

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    flatDir {
        dir 'libs'
    }
    mavenLocal()
    mavenCentral()
    maven { name "CurseMaven"; url "https://cursemaven.com" }
    // IE
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    // JEI
    maven { name = "DVS1 Maven FS"; url = "https://dvs1.progwml6.com/files/maven" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation(fg.deobf(baniraCodexCoords)) {
        changing = true
    }
    jarJar(baniraCodexCoords) {
        changing = true
        jarJar.ranged(it, baniraArtifactVersionRange)
    }

    // JEI
    runtimeOnly fg.deobf("curse.maven:jei-238222:${jei_id}")
    // AE
    // runtimeOnly fg.deobf("blank:appliedenergistics2:8.4.7")
    // IE
    // runtimeOnly fg.deobf("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}")

    // Narcissus
    compileOnly "curse.maven:narcissus-farewell-1210871:${narcissus_maven_id}"
    // compileOnly fg.deobf("blank:narcissus_farewell:forge-1.16.5-2.0.0.dev2")
    // runtimeOnly fg.deobf("blank:narcissus_farewell:forge-1.16.5-2.0.0.dev2")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transtive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             loader_type         : loader_type,
                             banira_version_range: banira_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    addMixinRuntimeMetadata(delegate)

    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

// region 将含 Jar-in-Jar 的 reobf 合并包同步到 builds
def aotakeCopyFatJar = { File fat, String destName ->
    if (fat != null && fat.exists()) {
        copy {
            from fat
            into file("${projectDir}/builds/${mod_version}")
            rename { destName }
        }
    }
}

afterEvaluate {
    def jarJarTask = tasks.findByName('jarJar')
    if (jarJarTask != null) {
        addMixinRuntimeMetadata(jarJarTask)
    }

    def reobfJarJarTask = tasks.findByName('reobfJarJar')
    if (reobfJarJarTask != null) {
        reobfJarJarTask.doLast {
            def reobfFat = layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
            aotakeCopyFatJar(reobfFat, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
        }
        tasks.named('assemble').configure { dependsOn reobfJarJarTask }
    } else {
        if (jarJarTask != null) {
            jarJarTask.doLast {
                def jar = jarJarTask.archiveFile.get().asFile
                aotakeCopyFatJar(jar, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
            }
            tasks.named('assemble').configure { dependsOn jarJarTask }
        }
    }
}
// endregion

afterEvaluate {
    def runtimeArchiveTasks = ['jar', 'jarJar']
            .collect { tasks.findByName(it) }
            .findAll { it != null }
    if (!runtimeArchiveTasks.isEmpty()) {
        def verifyMixinRuntimeArtifact = tasks.register('verifyMixinRuntimeArtifact') {
            group = 'verification'
            description = 'Verifies that release jars can discover and apply Aotake client mixins.'
            dependsOn runtimeArchiveTasks
            inputs.files(runtimeArchiveTasks.collect { it.archiveFile })

            doLast {
                def mixinConfig = "${mod_id}.mixins.json".toString()
                def mixinRefmap = "${mod_id}.refmap.json".toString()
                runtimeArchiveTasks.each { archiveTask ->
                    def archive = archiveTask.archiveFile.get().asFile
                    def jar = new java.util.jar.JarFile(archive)
                    try {
                        def configuredMixins = jar.manifest.mainAttributes.getValue('MixinConfigs')
                        def configNames = configuredMixins == null
                                ? []
                                : configuredMixins.split(',').collect { it.trim() }
                        if (!configNames.contains(mixinConfig)) {
                            throw new GradleException("${archive.name} does not declare ${mixinConfig}")
                        }
                        [
                                mixinConfig,
                                mixinRefmap,
                                'xin/vanilla/aotake/mixin/ContainerScreenAccessor.class',
                                'xin/vanilla/aotake/mixin/GuiMixin.class',
                                'xin/vanilla/aotake/mixin/MultiPlayerGameModeMixin.class'
                        ].each { entry ->
                            if (jar.getJarEntry(entry) == null) {
                                throw new GradleException("${archive.name} is missing ${entry}")
                            }
                        }
                    } finally {
                        jar.close()
                    }
                }
            }
        }
        tasks.named('check').configure { dependsOn verifyMixinRuntimeArtifact }
        tasks.named('assemble').configure { dependsOn verifyMixinRuntimeArtifact }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
