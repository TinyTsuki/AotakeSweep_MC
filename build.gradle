plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

apply from: 'gradle/config-view-processor.gradle'
apply from: 'gradle/aui-validation-output.gradle'

def javaVer = 25
if (JavaVersion.current() < JavaVersion.toVersion(javaVer)) {
    throw new GradleException('Minecraft 26.1 requires a Java 25 or newer Gradle JVM')
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

if (providers.gradleProperty('banira.neoForgeDependencyRepo').isPresent()) {
    minecraftArtifactCache.cacheDirectory.set(layout.projectDirectory.dir('.gradle/caches/minecraft'))
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        def uiSmoke = (project.findProperty('aotake.uiSmoke') ?: System.getProperty('aotake.uiSmoke') ?: 'false').toString()
        def uiSmokeExit = (project.findProperty('aotake.uiSmoke.exitOnFinish') ?: System.getProperty('aotake.uiSmoke.exitOnFinish') ?: 'false').toString()
        def uiSmokeWorld = (project.findProperty('aotake.uiSmoke.world') ?: System.getProperty('aotake.uiSmoke.world') ?: '').toString()
        systemProperty 'aotake.uiSmoke', uiSmoke
        systemProperty 'aotake.uiSmoke.exitOnFinish', uiSmokeExit
        systemProperty 'aotake.uiSmoke.world', uiSmokeWorld
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// region banira_codex：JarJar
def baniraArtifactVersionRange = "${banira_version_range}"
def baniraCodexCoords = "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"
// endregion banira_codex

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    def offlineSupplement = providers.gradleProperty('banira.neoForgeOfflineSupplement').orNull
    if (offlineSupplement != null) {
        named('Mojang LWJGL Free Type Repository') {
            url = uri(offlineSupplement)
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenLocal()
    def verifiedRepository = providers.gradleProperty('banira.neoForgeDependencyRepo').orNull
    if (verifiedRepository != null) {
        def verified = maven {
            url = uri(verifiedRepository)
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        remove(verified)
        addFirst(verified)
    }
    mavenCentral()
    maven { name "CurseMaven"; url "https://cursemaven.com" }
    // IE
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    // JEI
    maven { name = "DVS1 Maven FS"; url = "https://dvs1.progwml6.com/files/maven" }
}

apply from: "gradle/banira-local-fingerprint.gradle"
apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"


    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation(baniraCodexCoords) {
        changing = true
    }
    jarJar(baniraCodexCoords) {
        changing = true
        jarJar.ranged(it, baniraArtifactVersionRange)
    }

}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            loader_type            : loader_type,
            banira_version_range   : banira_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

apply from: 'gradle/mixin-runtime.gradle'

tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(baniraDistributionDirectory)
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

// region 将含 Jar-in-Jar 的 reobf 合并包同步到 builds
def aotakeCopyFatJar = { File fat, String destName ->
    if (fat != null && fat.exists()) {
        copy {
            from fat
            into baniraDistributionDirectory
            rename { destName }
        }
    }
}

afterEvaluate {
    def reobfJarJarTask = tasks.findByName('reobfJarJar')
    if (reobfJarJarTask != null) {
        reobfJarJarTask.doLast {
            def reobfFat = layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
            aotakeCopyFatJar(reobfFat, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
        }
        tasks.named('assemble').configure { dependsOn reobfJarJarTask }
    } else {
        def jarJarTask = tasks.findByName('jarJar')
        if (jarJarTask != null) {
            jarJarTask.doLast {
                def jar = jarJarTask.archiveFile.get().asFile
                aotakeCopyFatJar(jar, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
            }
            tasks.named('assemble').configure { dependsOn jarJarTask }
        }
    }
}
// endregion

apply from: 'gradle/aui-validation-publication.gradle'

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extra_settings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareDevFpsOverlay'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
