plugins {
    id 'fabric-loom' version '1.17.13'
    id 'maven-publish'
}

apply from: 'gradle/config-view-processor.gradle'

def javaVer = 21
def aotakeNetworkSmokeServer = (project.findProperty('aotake.networkSmoke.server') ?: 'false').toString().toBoolean()

version = project.mod_version
mod_id = project.mod_id
mod_name = project.mod_name
mod_desc = project.mod_desc

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

loom {
    runs {
        client {
            programArgs '--username', 'Dev', '--uuid', '380df991-f603-344c-a090-369bad2a924a'
            def uiSmoke = (project.findProperty('aotake.uiSmoke') ?: System.getProperty('aotake.uiSmoke') ?: 'false').toString()
            def uiSmokeExit = (project.findProperty('aotake.uiSmoke.exitOnFinish') ?: System.getProperty('aotake.uiSmoke.exitOnFinish') ?: 'false').toString()
            def uiSmokeWorld = (project.findProperty('aotake.uiSmoke.world') ?: System.getProperty('aotake.uiSmoke.world') ?: '').toString()
            property 'aotake.uiSmoke', uiSmoke
            property 'aotake.uiSmoke.exitOnFinish', uiSmokeExit
            property 'aotake.uiSmoke.world', uiSmokeWorld
        }
    }
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven { name "CurseMaven"; url "https://cursemaven.com" }
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.terraformersmc.com/releases" }
    mavenLocal()
    // IE
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    // JEI
    maven { name = "DVS1 Maven FS"; url = "https://dvs1.progwml6.com/files/maven" }

}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

apply from: "gradle/banira-local-fingerprint.gradle"

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    modRuntimeOnly "maven.modrinth:spark:cALUj9l1"
    modRuntimeOnly "maven.modrinth:fabric-permissions-api:62DUD085"
    if (!aotakeNetworkSmokeServer) {
        // Development runtime performance mod; not bundled into published artifacts.
        modRuntimeOnly "maven.modrinth:AANobbMI:u1OEbNKx"
        // Sodium Extra 0.6.x targets the bundled Sodium 0.6 line for Minecraft 1.21.1.
        modRuntimeOnly "maven.modrinth:sodium-extra:anDafurZ"
    }
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    testImplementation 'junit:junit:4.13.2'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.apache.maven:maven-artifact:4.0.0-rc-3"

    modImplementation("xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}") {
        changing = true
    }
}

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extraSettings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

prepareBaniraDevFpsOverlay()

// Loom does not expose nested runtime jars from client-only performance mods in dev runs.
def aotakeDevRuntimeModsDirectory = {
    def networkSmokeChild = (project.findProperty('aotake.networkSmoke.child') ?: 'false').toString().toBoolean()
    file(networkSmokeChild ? 'run-network-smoke/client/mods' : 'run/mods')
}
def prepareAotakeDevRuntimeLibraries = tasks.register('prepareDevRuntimeLibraries', Copy) {
    group = 'verification'
    description = 'Extracts nested client runtime libraries needed by development-only performance mods.'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        (configurations.runtimeClasspath.files + configurations.modRuntimeOnly.files)
                .findAll { file -> file.name.startsWith('sodium') || file.name.startsWith('AANobbMI') }
                .collect { file -> zipTree(file) }
    }) {
        include 'META-INF/jars/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into aotakeDevRuntimeModsDirectory
}

tasks.matching { task -> task.name == 'runClient' }.configureEach {
    dependsOn prepareAotakeDevRuntimeLibraries
}

tasks.register('verifyDevRuntimeLibraries') {
    group = 'verification'
    description = 'Verifies nested Sodium runtime libraries are available to the Fabric development client.'
    dependsOn prepareAotakeDevRuntimeLibraries
    doLast {
        def names = aotakeDevRuntimeModsDirectory().listFiles()?.collect { it.name } ?: []
        ['CaffeineConfig-'].each { prefix ->
            if (!names.any { name -> name.startsWith(prefix) }) {
                throw new GradleException("Missing development runtime library with prefix '${prefix}'")
            }
        }
    }
}

processResources {
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_desc", project.mod_desc
    inputs.property "version", project.version
    inputs.property "mod_authors", project.mod_authors
    inputs.property "sources_url", project.sources_url
    inputs.property "issues_url", project.issues_url
    inputs.property "license", project.license
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "loader_type", project.loader_type
    inputs.property "banira_version_range", project.banira_version_range
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "mod_id": mod_id,
                "mod_name": project.mod_name,
                "mod_desc": project.mod_desc,
                "version": project.version,
                "mod_authors": project.mod_authors,
                "sources_url": project.sources_url,
                "issues_url": project.issues_url,
                "license": project.license,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "loader_type": project.loader_type,
                "banira_version_range": project.banira_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (javaVer >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(javaVer)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(javaVer)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    from("LICENSE") {
        rename { "${it}_${project.mod_id}" }
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('remapJar') {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
}

apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
